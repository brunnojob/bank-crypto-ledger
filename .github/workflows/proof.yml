name: Executable proof
'on':
  push:
    paths-ignore:
    - docs/proof/**
    - README.md
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Record executable proof
      run: python .proof/record.py
    - name: Upload execution evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-proof
        path: docs/proof/
        if-no-files-found: error
        retention-days: 30
    - name: Publish proof summary
      if: always()
      run: python .proof/summary.py
